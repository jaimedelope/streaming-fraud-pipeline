<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Streaming Fraud Pipeline</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">Real-time demo</p>
      <h1>Fraud Detection Streaming Pipeline</h1>
      <p class="sub">Kafka → anomaly scoring → live metrics</p>
    </div>
    <div class="status" id="status">connecting…</div>
  </header>

  <section class="metrics" id="metrics">
    <article class="metric"><span class="label">Transactions</span><strong id="txTotal">0</strong></article>
    <article class="metric"><span class="label">Anomalies</span><strong id="anomTotal">0</strong></article>
    <article class="metric"><span class="label">Anomaly rate</span><strong id="anomRate">0%</strong></article>
    <article class="metric"><span class="label">Latency p50</span><strong id="p50">0 ms</strong></article>
    <article class="metric"><span class="label">Latency p95</span><strong id="p95">0 ms</strong></article>
    <article class="metric"><span class="label">Latency avg</span><strong id="avg">0 ms</strong></article>
  </section>

  <section class="grid">
    <div class="panel">
      <h2>Live transactions</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>User</th>
              <th>Amount</th>
              <th>Merchant</th>
              <th>Country</th>
              <th>Score</th>
              <th>Latency</th>
            </tr>
          </thead>
          <tbody id="txBody"></tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h2>Anomalies</h2>
      <ul id="anomList" class="anom-list"></ul>
    </div>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
